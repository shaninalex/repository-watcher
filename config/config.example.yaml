providers:
  - provider: github
    token: <api-token>

  - provider: gitlab
    token: <api-token>

repositories:
  - url: https://github.com/shaninalex/repository-watcher.git
    branch: master
    pull: true
    issue: true
    action:
      - deployment
      - lint
  - url: git@github.com:shaninalex/Lumna.git
    branch: master
    action:
      - release
