providers:
  - provider: github
    token: <api-token>

  - provider: gitlab
    token: <api-token>

repositories:
  - url: https://github.com/shaninalex/repository-watcher.git
    branch: master
    interval: 24h
    targets:
      - actions: deployment, lint
      - pull: true
      - issue: true

  - url: git@github.com:shaninalex/Lumna.git
    branch: master
    interval: 5m
    targets:
      - actions: release

polling:
  releases:
    interval_seconds: 300

  actions:
    interval_seconds: 45

  pipelines:
    interval_seconds: 45

  repository_metadata:
    interval_seconds: 1800