name: Go

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Install dependencies
        run: go get .
      - name: Build
        run: go build -v ./app/main.go
